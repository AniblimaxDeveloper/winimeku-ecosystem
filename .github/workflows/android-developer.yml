name: Build Developer Console APK
on:
  push:
    branches: [ "main" ]
    paths: [ "apps/developer-console/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Grant execute permission for gradlew
        run: cd apps/developer-console && chmod +x gradlew
      - name: Build Debug APK
        run: cd apps/developer-console && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winimeku-Developer-debug
          path: apps/developer-console/app/build/outputs/apk/debug/app-debug.apk
